name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: a stacked PR targets the branch below it, not main, so a
  # `branches: [main]` filter here would silently skip every PR in a stack except the
  # bottom one. CI has to gate the merge, not run after it.
  pull_request:

# Cancel superseded runs on the same ref (e.g. new pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-uv reads the committed .python-version (3.12); the project is pinned
      # >=3.12,<3.13 because the pinned tau2 revision imports stdlib `audioop`, removed in 3.13.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Installs the project plus the default `dev` dependency group, which pulls the env
      # extras. The tau2 / yc_bench / automationbench upstreams are *not* pip dependencies —
      # each port fetches its SHA-pinned source into ~/.cache/shogym on first use, so the
      # runner needs plain HTTPS access to codeload.github.com when those tests run.
      - name: Install dependencies
        run: uv sync

      # The offline suite runs keyless: keyed tests (tau2 user-sim, hle judge) self-skip
      # without OPENAI_API_KEY. Unset it explicitly so nothing here depends on a secret.
      # `not docker` deselects the orca_bench live-stack tests: that env's environment is a
      # 28-service compose project behind a ~133 GB image, which a hosted runner (~14 GB of disk)
      # cannot hold at any timeout. Everything else about that port is offline and does run here.
      # `-m "not network"` is the other half of the same promise: it deselects the tests that
      # reach a third-party service while they run (see NETWORK_ORACLE_TASKS in
      # tests/envs/test_frontier_bench_served.py), so a PR cannot go red because someone else's
      # server had a bad minute. A plain `uv run pytest` still selects them.
      #
      # SHOGYM_REQUIRE_UPSTREAM removes the runtime-provisioned envs' escape hatch. Their test
      # modules must import a production adapter before they can collect, and a laptop with no
      # extras or no network is allowed to skip that; this runner has both, so here any failure to
      # provision and import — upstream drift, a gap in a hand-maintained extra, a corrupt
      - name: Run tests (offline, keyless)
        run: env -u OPENAI_API_KEY SHOGYM_REQUIRE_UPSTREAM=1 uv run pytest -q -m "not network and not docker"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright
