name: CI

on:
  push:
    branches: [main]
  # No base-branch filter: a stacked PR targets the branch below it, not main, so a
  # `branches: [main]` filter here would silently skip every PR in a stack except the
  # bottom one. CI has to gate the merge, not run after it.
  pull_request:

# Cancel superseded runs on the same ref (e.g. new pushes to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # setup-uv reads the committed .python-version (3.12); the project is pinned
      # >=3.12,<3.13 because the pinned tau2 revision imports stdlib `audioop`, removed in 3.13.
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Installs the project plus the default `dev` dependency group, which pulls the env
      # extras. The tau2 / yc_bench / automationbench upstreams are *not* pip dependencies —
      # each port fetches its SHA-pinned source into ~/.cache/shogym on first use, so the
      # runner needs plain HTTPS access to codeload.github.com when those tests run.
      - name: Install dependencies
        run: uv sync

      # The one step that fetches benchmark material, and the only one allowed to. It provisions
      # each pinned upstream source, tau2's domain data, the Temporal test server binary, every
      # frontier_bench task image and the packages one vendored oracle installs while it runs,
      # which is what the offline step below then requires rather than downloads. Putting the
      # fetching here is what makes a slow mirror or a bad minute at a registry fail in the stage
      # whose job is fetching, instead of inside a run that calls itself offline. Nothing may skip
      # in this mode either, so a preparation that did not prepare says so.
      - name: Prepare upstream sources, data and task images (networked)
        run: env -u OPENAI_API_KEY SHOGYM_PROVISIONING=prepare uv run python tests/prepare_offline_suite.py

      # The offline suite runs keyless: keyed tests (tau2 user-sim, hle judge) self-skip
      # without OPENAI_API_KEY. Unset it explicitly so nothing here depends on a secret.
      # `-m "not network"` is the other half of the same promise: it deselects the tests that
      # reach a third-party service while they run (see NETWORK_ORACLE_TASKS in
      # tests/envs/test_frontier_bench_served.py), so a PR cannot go red because someone else's
      # server had a bad minute. A plain `uv run pytest` still selects them.
      #
      # SHOGYM_PROVISIONING=offline is what makes "offline" a property of this run rather than a
      # description of it: no pinned source is downloaded and no task image is built here, so
      # anything the step above failed to prepare fails by name instead of being fetched from
      # under a promise. It also removes the runtime-provisioned envs' escape hatch, since this
      # runner has the extras and was prepared: a failure to provision and import (upstream
      # drift, a gap in a hand-maintained extra, a corrupt cache, a plain NameError) is a red
      # test here, never a quiet skip that would delete an env's coverage while the run stays
      # green. `--no-sync` is the same promise applied to uv itself: the environment was installed
      # two steps up, and a step that may not fetch should not be one resolver away from doing it.
      - name: Run tests (offline, keyless)
        run: env -u OPENAI_API_KEY SHOGYM_PROVISIONING=offline uv run --no-sync pytest -q -m "not network"

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright
