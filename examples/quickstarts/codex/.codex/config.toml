# Project-scoped Codex config: this is how the stream gets attached.
#
# Codex layers `.codex/config.toml` files found between the working directory and the repo root
# on top of your user config, for a project you have trusted. So this file is in force exactly
# when you run `codex` from this directory, and `~/.codex/config.toml` is never written to: your
# own servers, model and plugins are untouched.
#
# `hgym` is the server name, and Codex namespaces this server's tools under it.

[mcp_servers.hgym]
command = "uv"
args = ["run", "python", "serve.py"]
# `serve.py` is relative to the directory you launch Codex from, which is this one.

# Pre-approve this server's tools, and note the value: `approve` grants them up front, `auto`
# decides per tool and an unannotated tool decides to ask. `codex exec` has nobody to ask, so
# without this every call returns "user cancelled MCP tool call" and the agent reasonably
# concludes the stream is broken. This is the one knob to reach for when that happens.
default_tools_approval_mode = "approve"

# Startup imports hgym and opens the queue. The 10s default is tight for a cold venv.
startup_timeout_sec = 60.0

# One tool call is one step of an episode, and the first `get_task` of an env that fetches its
# pinned upstream source pays for that download. The 60s default does not cover it.
tool_timeout_sec = 900.0
