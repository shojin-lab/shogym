[project]
name = "shogym"
version = "0.1.0"
description = "Environments that meet an agent at the tool surface"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andrew Jesson", email = "andrew.d.jesson@gmail.com" }]
# Pinned to Python 3.12: the tau2-bench port (the [tau2] extra) requires it — the pinned tau2
# revision imports the stdlib `audioop` module, which was removed in 3.13. Keeping the whole
# project on 3.12 avoids per-dependency version gymnastics.
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "fastmcp>=3.2",
    "minijinja>=2.0",
    "numpy>=1.26",
    # RFC 009: the serve layer validates a score-terminal call's args against the full
    # advertised JSON Schema *before* it seals the episode. jsonschema is already resolved
    # transitively (via fastmcp); declaring it makes the direct import explicit.
    "jsonschema>=4.20",
]
keywords = ["llm", "agents", "evaluation", "mcp", "harness", "gym", "optimization"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/shojin-lab/shogym"
Repository = "https://github.com/shojin-lab/shogym"

[project.scripts]
shogym = "shogym.cli:main"

[project.optional-dependencies]
analysis = ["pandas>=2.2", "duckdb>=1.0"]
# The tau2-bench port (src/shogym/envs/tau2). Upstream is pinned to commit 1d244f5 but **cannot be
# a requirement**: PyPI forbids direct (`@ git+https://`) references, and the `tau2` name on PyPI
# belongs to an unrelated magnetochemistry library, so a plain `tau2` requirement would silently
# install the wrong package (there is no tau2-bench release matching the pin under any name). So
# the pinned upstream source is provisioned at runtime into a gitignored cache
# (`~/.cache/shogym/tau2/<sha>/`, honoring `TAU2_SRC` / `SHOGYM_CACHE`) — see
# src/shogym/envs/tau2/adapter.py — and this extra declares the dependencies pip used to resolve
# transitively through that direct requirement: upstream's `[project] dependencies` verbatim at
# the pinned SHA, plus its `[gym]` extra (gymnasium, for the GymAgent bridge) and `[knowledge]`
# extra (rank-bm25 + openai, for banking's offline retrieval). Kept optional so `pip install
# shogym` (and the core test suite) stay lean and never import tau2 — `import shogym` registers
# `tau2_*` envs without provisioning or loading it.
# NOTE: tau2's `data/` is a separate provisioning concern and is unchanged — a tau2 env still
# needs a data checkout, either via `TAU2_DATA_DIR` or via a full `TAU2_SRC` clone whose sibling
# `data/` upstream resolves on its own. The default runtime fetch extracts only `src/tau2`.
tau2 = [
    # upstream [project] dependencies @ 1d244f5
    "addict>=2.4.0",
    "deepdiff>=8.4.2",
    "docstring-parser>=0.16",
    "fastapi>=0.115.11",
    "httpx>=0.24.0",
    "litellm>=1.80.15,<1.82.7",
    "loguru>=0.7.3",
    "numpy>=1.24.0",
    "pandas>=2.2.3",
    "psutil>=7.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0.2",
    "requests>=2.31.0",
    "rich",
    "tabulate>=0.9.0",
    "tenacity>=9.0.0",
    "toml>=0.10.2",
    "typer>=0.12.5",
    "uvicorn>=0.34.0",
    # upstream [gym] extra
    "gymnasium>=1.2.2",
    # upstream [knowledge] extra
    "openai>=1.0.0",
    "rank-bm25>=0.2.2",
]
# The HLE env (src/shogym/envs/hle): `datasets` lazy-loads the gated `cais/hle` benchmark, and
# `openai` backs the default model-graded judge (an OpenAI-compatible client, created only
# when the judge is first called). Optional so `pip install shogym` (and the core offline test
# suite) stay lean — `import shogym` registers `hle` without importing either. Offline tests
# inject their own tasks + a scripted judge, so they need neither the download nor a key.
hle = [
    "datasets>=2.19",
    "openai>=1.99",
]
# The YC-Bench port (src/shogym/envs/yc_bench). YC-Bench has no stable public API, so the port
# wraps its internal modules (sim engine, world seeder, config loader, command policy, ORM) behind
# a thin adapter — pinning a SHA makes drift a one-file maintenance cost. Upstream is pinned to
# commit e7d6067 but **cannot be a requirement**: PyPI forbids direct (`@ git+https://`)
# references, and the `yc-bench` 0.1.0 release on PyPI is not the pinned commit. So the pinned
# upstream source is provisioned at runtime into a gitignored cache
# (`~/.cache/shogym/yc_bench/<sha>/`, honoring `YC_BENCH_SRC` / `SHOGYM_CACHE`) — see
# src/shogym/envs/yc_bench/adapter.py — and this extra declares the dependencies pip used to
# resolve transitively through that direct requirement: upstream's `[project] dependencies`
# verbatim at the pinned SHA. Kept optional so `pip install shogym` (and the core test suite) stay
# lean and never import yc_bench — `import shogym` registers the `yc_bench` env without
# provisioning or loading it. YC-Bench generates its whole world from a seed (business attributes
# reproducibly; row ids are uuid4 and differ per run), so
# (unlike tau2) it needs no external data provisioned at runtime.
yc_bench = [
    # upstream [project] dependencies @ e7d6067
    "litellm>=1.40",
    "matplotlib>=3.10.8",
    "plotly>=6.6.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.55.0",
    "typer>=0.9",
]
# The Frontier-Bench port (src/shogym/envs/frontier_bench) vendors the runtime files of five
# Frontier-Bench task directories byte-for-byte, at upstream commit eb4af26c, each guarded by a
# pinned content hash. Upstream's `maintainer/` tooling is not carried, and the env, the Docker
# backend and the manifest are shogym code. Its only runtime dependency is a working
# local **Docker** daemon (a system dependency, not a pip package): the env builds+runs the task's
# environment container as the served agent's world and runs the task's own verifier container
# for the 0/1 verdict. The Python code needs nothing beyond shogym's core dependencies (Docker is
# driven with stdlib `subprocess`, the manifest parsed with `tomllib`), so this extra
# carries no Python packages — it exists as a stable install/label target and a home for this
# note. `import shogym` registers `frontier_bench` without importing Docker; only serving an
# episode shells out to `docker`. The vendored files are tiny, so describe / verdict-parsing /
# the offline tests need neither Docker nor a network.
frontier_bench = []
# The AutomationBench port (src/shogym/envs/automationbench). Upstream (MIT, © Zapier) is pinned to
# commit a321764 and, on top of the PyPI direct-reference ban that rules out a git requirement for
# tau2/yc-bench, cannot be resolved by pip at all: it declares `requires-python >=3.13` (shogym is
# hard-pinned to <3.13 for tau2's `audioop`) and pulls the heavy `verifiers` / `anthropic`
# agent-loop stack — an unsatisfiable resolve on 3.12. The env-as-center port needs none of that
# loop, only the offline verifiers-free pieces (simulated tools + WorldState, task defs, pure
# rubric), which import fine on 3.12 with just `pydantic` + `datasets`. So the pinned upstream
# source is provisioned at runtime into a gitignored cache
# (`~/.cache/shogym/automationbench/<sha>/`, honoring `AUTOMATIONBENCH_SRC` / `SHOGYM_CACHE`) — never
# vendored into the repo — and this extra only needs `datasets` (the domain loaders build a
# HuggingFace `Dataset`). Kept optional so `pip install shogym` (and the core offline test suite)
# stay lean — `import shogym` registers the `automationbench` env without provisioning or `datasets`.
automationbench = [
    "datasets>=2.19",
]
# The BrowseComp-Plus port (src/shogym/envs/browsecomp_plus), pinned to upstream
# commit 0469490. `datasets` lazy-loads the XOR-encrypted `Tevatron/browsecomp-plus` queries
# (decrypted in memory only — never persisted), `openai` backs the default model-graded judge,
# and `pyserini` (which also needs a Java 21 runtime) is the BM25/Lucene retriever over the
# prebuilt corpus index. Optional so `pip install shogym` (and the core offline test suite) stay
# lean — `import shogym` registers `browsecomp_plus` without importing any of them. Offline tests
# inject their own tasks + an in-memory searcher + a scripted judge, so they need none of it
# (no download, no key, no Java).
browsecomp_plus = [
    "datasets>=2.19",
    "openai>=1.99",
    "pyserini>=0.22",
]

[dependency-groups]
# The dev group is synced by default (plain `uv run` / `uv sync`), so putting the env extras
# here is what makes `uv run …` include them out of the box. `pip install shogym` never installs
# dependency-groups, so the core pip install stays lean.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "shogym[tau2]",
    "shogym[hle]",
    "shogym[yc_bench]",
    "shogym[frontier_bench]",
    "shogym[automationbench]",
    "shogym[browsecomp_plus]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# NOTE: `[tool.hatch.metadata] allow-direct-references` is deliberately absent. PyPI rejects any
# distribution whose metadata carries a direct (`@ git+https://` / URL) requirement, so leaving it
# off makes hatchling fail the *build* if one is ever reintroduced — an early, local error instead
# of a 400 at upload time. Pinned upstream sources are provisioned at runtime instead; see the
# `tau2`, `yc_bench`, and `automationbench` extras above and src/shogym/envs/_upstream.py.

[tool.hatch.build.targets.wheel]
packages = ["src/shogym"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Repo root on sys.path so tests can import the `tests._mcp_fixtures` servers.
pythonpath = ["."]
# Unknown marks are an error, not a warning: a mistyped `network` mark would silently leave its
# test in the suite the mark exists to keep it out of.
addopts = "--strict-markers"
markers = [
    # A test that reaches a third party over the network while it runs. Everything else here is
    # offline (vendored data, in-process fixtures, self-skipping keyed paths), so the CI step
    # that promises "offline, keyless" deselects this with `-m "not network"`. A plain `pytest`
    # run still selects it, which is where a live upstream dependency is meant to be checked,
    # with a human reading the result.
    "network: needs a live third-party service; deselected from the offline suite",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored, pinned upstream benchmark task files (redistributed byte-for-byte with the canary):
# not this project's code and never imported by shogym — they run only inside task containers.
extend-exclude = ["src/shogym/envs/frontier_bench/tasks"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
# The vendored frontier_bench task files (solution/solve.py, tests/test_outputs.py) are pinned
# upstream artifacts executed inside the task's Docker containers — not part of shogym's typed
# surface and never imported by the port — so they are excluded from type-checking.
exclude = ["src/shogym/envs/frontier_bench/tasks"]
