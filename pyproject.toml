[project]
name = "hgym"
version = "0.0.1"
description = "Harness Gym — environments for agents whose policy boundary is the tool surface"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andrew Jesson", email = "andrew.d.jesson@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "openai>=1.99",
    "fastmcp>=3.2",
    "minijinja>=2.0",
    "numpy>=1.26",
    "tomli-w>=1.0",
]
keywords = ["llm", "agents", "evaluation", "mcp", "harness", "gym", "optimization"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/anndvision/hgym"
Repository = "https://github.com/anndvision/hgym"

[project.optional-dependencies]
analysis = ["pandas>=2.2", "duckdb>=1.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    "ruff>=0.8",
    "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hgym"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Repo root on sys.path so tests can import the `tests._mcp_fixtures` servers.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
