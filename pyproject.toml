[project]
name = "hgym"
version = "0.0.1"
description = "Harness Gym — environments for agents whose policy boundary is the tool surface"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Andrew Jesson", email = "andrew.d.jesson@gmail.com" }]
# Pinned to Python 3.12: the tau2-bench port (the [tau2] extra) requires it — the pinned tau2
# revision imports the stdlib `audioop` module, which was removed in 3.13. Keeping the whole
# project on 3.12 avoids per-dependency version gymnastics.
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "fastmcp>=3.2",
    "minijinja>=2.0",
    "numpy>=1.26",
    # RFC 009: the serve layer validates a score-terminal call's args against the full
    # advertised JSON Schema *before* it seals the episode. jsonschema is already resolved
    # transitively (via fastmcp); declaring it makes the direct import explicit.
    "jsonschema>=4.20",
]
keywords = ["llm", "agents", "evaluation", "mcp", "harness", "gym", "optimization"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/anndvision/hgym"
Repository = "https://github.com/anndvision/hgym"

[project.scripts]
hgym = "hgym.cli:main"

[project.optional-dependencies]
analysis = ["pandas>=2.2", "duckdb>=1.0"]
# Only the real OpenAI model path in examples/openai_harness.py needs this — the core and
# the offline tests never import openai.
examples = ["openai>=1.99"]
# The tau2-bench port (src/hgym/envs/tau2), pinned to an upstream commit SHA: `[gym]` pulls
# gymnasium (the GymAgent bridge needs it), `[knowledge]` pulls rank-bm25 (banking's offline
# retrieval). Kept as an optional extra so `pip install hgym` (and the core test suite) stay
# lean and never import tau2 — `import hgym` registers `tau2_*` envs without loading it.
# NOTE: tau2 does not ship its `data/` in the wheel, so it must be provisioned at runtime; the
# tau2 example lazy-downloads it (or honor `TAU2_DATA_DIR`).
tau2 = [
    "tau2[gym,knowledge] @ git+https://github.com/sierra-research/tau2-bench@1d244f5dca42944b67a379b44bfeb9f5748f189d",
]
# The HLE env (src/hgym/envs/hle): `datasets` lazy-loads the gated `cais/hle` benchmark, and
# `openai` backs the default model-graded judge (an OpenAI-compatible client, created only
# when the judge is first called). Optional so `pip install hgym` (and the core offline test
# suite) stay lean — `import hgym` registers `hle` without importing either. Offline tests
# inject their own tasks + a scripted judge, so they need neither the download nor a key.
hle = [
    "datasets>=2.19",
    "openai>=1.99",
]
# The YC-Bench port (src/hgym/envs/yc_bench), pinned to an upstream commit SHA. YC-Bench has no
# stable public API, so the port wraps its internal modules (sim engine, world seeder, config
# loader, command policy, ORM) behind a thin adapter — pinning a SHA makes drift a one-file
# maintenance cost. Kept as an optional extra so `pip install hgym` (and the core test suite)
# stay lean and never import yc_bench — `import hgym` registers the `yc_bench` env without
# loading it. YC-Bench generates its whole world deterministically from a seed, so (unlike
# tau2) it needs no external data provisioned at runtime.
yc_bench = [
    "yc-bench @ git+https://github.com/collinear-ai/yc-bench@e7d606789be4c52a34f9fa5b04ada4a2eaf9d731",
]

[dependency-groups]
# The dev group is synced by default (plain `uv run` / `uv sync`), so putting the env extras
# here is what makes `uv run …` include them out of the box. `pip install hgym` never installs
# dependency-groups, so the core pip install stays lean.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "hgym[tau2]",
    "hgym[hle]",
    "hgym[yc_bench]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# The `tau2` optional extra pins upstream to a git commit SHA (a direct reference).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/hgym"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Repo root on sys.path so tests can import the `tests._mcp_fixtures` servers.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
